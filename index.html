<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arrow Melody</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3ead9;--ink:#3b2a1c;--muted:#8a7765;--chip:#e8dcc6;--star:#d99a1e;--card:#fbf6ec;--btn:#3b2a1c;--btnInk:#fbf6ec;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;transition:background .25s,color .25s}
body[data-theme="neon"]{--bg:#07070d;--ink:#f3f0ff;--muted:#8b86a8;--chip:#17162a;--star:#ffe94a;--card:#12111f;--btn:#ffe94a;--btnInk:#07070d}
body[data-theme="dark"]{--bg:#1b1d24;--ink:#ecebe6;--muted:#8d8f98;--chip:#272a33;--star:#f0c75e;--card:#23262e;--btn:#f0c75e;--btnInk:#1b1d24}
body[data-theme="ivory"]{--bg:#f3ead9;--ink:#3b2a1c;--muted:#8a7765;--chip:#e6d9c1;--star:#d99a1e;--card:#fbf6ec;--btn:#3b2a1c;--btnInk:#fbf6ec}
body[data-theme="white"]{--bg:#ffffff;--ink:#1c1c22;--muted:#8c8c96;--chip:#f0f0f4;--star:#f2a100;--card:#ffffff;--btn:#1f7ae0;--btnInk:#fff}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:46px 46px 1fr 46px 46px;align-items:center;gap:4px;padding:10px 12px 4px}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:var(--chip);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,button:focus-visible{outline:2px solid var(--star);outline-offset:2px}
#titleBtn{background:none;border:0;color:var(--ink);text-align:center;cursor:pointer;padding:0}
#lvTitle{display:block;font-family:"Jua",system-ui,sans-serif;font-size:26px;line-height:1.1}
#lvSub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;min-height:16px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0}
#stars{display:flex;gap:3px;flex-wrap:wrap}
.star svg{width:26px;height:26px;display:block;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round;opacity:.55;transition:all .25s}
.star.on svg{fill:var(--star);stroke:var(--star);opacity:1}
body[data-theme="neon"] .star.on svg{filter:drop-shadow(0 0 5px var(--star))}
.star.pop svg{animation:pop .5s}
@keyframes pop{0%{transform:scale(1.35)}40%{transform:scale(.7) rotate(-15deg)}100%{transform:scale(1)}}
.right{display:flex;align-items:center;gap:10px}
#left{font-size:12.5px;color:var(--muted)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
#timer{font-family:"Jua",system-ui,sans-serif;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
#timeLine{margin-top:2px;color:var(--ink)}#timeLine b{color:var(--star)}
.node .bt{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:#cfd6ff;white-space:nowrap;text-shadow:none;font-family:system-ui,sans-serif}
.tools{display:flex;justify-content:center;gap:14px;padding:6px 0 14px}
.tb{position:relative;width:58px;height:58px;border-radius:18px;border:0;background:var(--chip);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.tb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--ink);color:var(--bg)}
#hintBadge{position:absolute;top:-7px;right:-9px;font-size:10px;font-weight:700;background:var(--star);color:#1a1a1a;border-radius:9px;padding:2px 6px}
#hintBadge.ad{background:var(--muted);color:var(--bg)}
#boardWrap{flex:1;position:relative;min-height:0;margin:6px 4px 0}
#board{position:absolute;inset:0;touch-action:none}
#tip{margin:4px 20px 2px;min-height:20px;text-align:center;font-family:"Jua",system-ui,sans-serif;font-size:18px;color:var(--ink)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}
/* 처음 화면: 네이비 바탕 + 세로 길 지도 (테마와 상관없이 고정) */
.home{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 18px 12px;background:#242b4f;overflow:hidden;color:#fff}
#homeBg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.home>*:not(#homeBg){position:relative;z-index:1}
.homeTop{width:100%;max-width:560px;display:flex;align-items:flex-start;justify-content:space-between}
.brand{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:230px}
#logoArt{width:100%;height:78px;border-radius:14px;background:#07070d;box-shadow:0 0 0 2px #2c2a55,0 0 18px rgba(120,90,255,.35)}
.logo{font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:29px;margin:0;padding:7px 10px;border-radius:18px;background:#1b2140;letter-spacing:-.4px;text-align:center;white-space:nowrap;overflow:hidden}
.logo i{font-style:normal}
.ib.hb{background:#353d6b;color:#fff}
.road{flex:1;position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 0 10px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 5%,#000 95%,transparent)}
.road::-webkit-scrollbar{display:none}
.road>:first-child{margin-top:auto}.road>:last-child{margin-bottom:auto}
button.node{border:0;padding:0;cursor:pointer;font-family:"Jua",system-ui,sans-serif}
.roadTip{margin:14px 0 4px;font-size:12px;color:#9aa1c7;flex:none}
.seg{width:14px;height:30px;background:#171c38;border-radius:4px;flex:none}
.seg.done{background:#22c3e6}
.node{display:grid;place-items:center;border-radius:50%;font-family:"Jua",system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);position:relative;flex:none}
.node.done{width:84px;height:84px;font-size:28px;background:#22c3e6;box-shadow:inset 0 -7px 0 #1592b0,0 0 0 5px #cfd8ff}
.node.now{width:126px;height:126px;font-size:44px;background:#ff4f9a;box-shadow:inset 0 -9px 0 #d12f74,0 0 0 9px #ffd23f,0 8px 0 9px #d9a400}
.node.lock{width:92px;height:92px;font-size:32px;background:#6b7394;color:#c8cde0;box-shadow:inset 0 -7px 0 #525a7a,0 0 0 5px #3a4270}
.node.far{width:66px;height:66px;font-size:22px;background:#4b5379;color:#9aa1bf;box-shadow:inset 0 -5px 0 #3b4266}
.node .st{position:absolute;top:-18px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .st svg{width:22px;height:22px;fill:#ffd23f;stroke:#e0a100;stroke-width:1.2}
.padlock{width:46px;height:52px;margin:-6px 0;position:relative;z-index:2;flex:none}
.go{width:min(380px,100%);border:5px solid #ffd23f;border-radius:26px;padding:12px 10px 10px;background:#ff4f9a;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:inset 0 -8px 0 #d12f74,0 6px 0 #d9a400;margin-top:10px}
.go:active{transform:translateY(4px);box-shadow:inset 0 -8px 0 #d12f74,0 2px 0 #d9a400}
.go span{font-family:"Jua",system-ui,sans-serif;font-size:36px;text-shadow:0 3px 0 rgba(0,0,0,.28)}
.go small{font-family:"Jua",system-ui,sans-serif;font-size:19px;color:#ffe3ef}
.extras{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
.pill{border:0;border-radius:999px;padding:9px 16px;font-family:"Jua",system-ui,sans-serif;font-size:16px;background:#353d6b;color:#fff;cursor:pointer;box-shadow:inset 0 -3px 0 #262c52}
.pill b{color:#ffd23f}
.pill.skip{background:#ffd23f;color:#3a2a00;box-shadow:inset 0 -3px 0 #d9a400}
#earnLine{color:#ff4f9a;font-weight:700;margin-top:4px}
.foot{margin-top:12px;font-size:11.5px;color:#9aa1c7}
@media (max-height:739px){.seg{height:22px}.node.now{width:104px;height:104px;font-size:36px}.node.done{width:70px;height:70px;font-size:24px}.node.lock{width:76px;height:76px;font-size:26px}.go span{font-size:30px}.logo{font-size:25px}#logoArt{height:62px}}
/* 테마 고르기 */
#themePop{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:max(12px,calc(50vw - 268px));z-index:20;background:var(--card);border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(4,64px);gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sw{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.sw em{font-style:normal;font-size:11.5px}
.swv{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:4px;border:3px solid transparent}
.swv i{width:5px;height:24px;border-radius:3px}
.sw.sel .swv{border-color:var(--star)}
.sw-neon{background:#07070d}.sw-neon i{box-shadow:0 0 6px currentColor}
.sw-dark{background:#1b1d24}.sw-ivory{background:#f3ead9;box-shadow:inset 0 0 0 1px #d9ccb3}.sw-white{background:#fff;box-shadow:inset 0 0 0 1px #ddd}
#soundBtn .s-fun,#soundBtn .s-off{display:none}
#soundBtn[data-mode="fun"] .s-basic,#soundBtn[data-mode="off"] .s-basic{display:none}
#soundBtn[data-mode="fun"] .s-fun{display:block}#soundBtn[data-mode="off"] .s-off{display:block}
/* 팝업 */
.modal{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:24px}
.modal[hidden],[hidden]{display:none!important}
.card{background:var(--card);color:var(--ink);border-radius:26px;padding:28px 24px 22px;width:min(340px,100%);text-align:center;animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
.card h2{font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:34px;margin:0 0 6px}
#clearModal.big .card h2{font-size:40px}
.card p{margin:0 0 6px;color:var(--muted);font-size:14.5px;line-height:1.5}
#perfect{color:var(--star);font-weight:700}
.pbtn{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px;font-family:"Jua",system-ui,sans-serif;font-size:20px;background:var(--btn);color:var(--btnInk);cursor:pointer}
.sbtn{display:block;width:100%;margin-top:8px;border:0;border-radius:16px;padding:12px;font-size:15px;background:var(--chip);color:var(--ink);cursor:pointer}
#adModal .card{background:#222;color:#fff}#adModal p{color:#aaa}
#adCount{font-family:"Jua",sans-serif;font-size:54px;margin:8px 0}
.jrow{display:flex;gap:10px;justify-content:center;margin-top:12px}
.jrow label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.jrow input{width:96px;font-size:18px;padding:8px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--ink);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:40}
@media (prefers-reduced-motion:reduce){.card,.star.pop svg{animation:none}}
</style>
</head>

<script>
// ===== 화살의 미로 : 판 생성기 v2 =====
// 1) 모양(또는 사각형) 안을 뱀처럼 구불구불한 선으로 빈틈없이 채우고
// 2) 실제로 풀어보면서, 막히는 곳은 화살 방향을 뒤집거나 둘로 나눠
// 3) "반드시 풀 수 있는" 빽빽한 판을 만듭니다. 같은 번호 = 항상 같은 판.

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const LEVEL_STAGES=[5,20,50,500];
function stagesInLevel(lv){return lv<=4?LEVEL_STAGES[lv-1]:1000;}
function starsForLevel(lv){return lv<=2?3:lv<=6?4:lv<=9?5:8;}

// 전체 번호(No.) ↔ 내부 단계(lv, st)
function toNo(lv,st){let n=0;for(let l=1;l<lv;l++)n+=stagesInLevel(l);return n+st+1;}
function fromNo(no){let lv=1;no=Math.max(1,no|0);while(no>stagesInLevel(lv)){no-=stagesInLevel(lv);lv++;}return{lv,st:no-1};}

// 선율을 듣기 좋은 높이로 자동 이동
function parseSong(s){const NI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const ns=s.n.split(' ').map(t=>{const[p,d]=t.split(':'),m=p.match(/^([A-G])(#?)(\d)$/);return{m:12*(+m[3]+1)+NI[m[1]]+(m[2]?1:0),d:d?parseFloat(d):1};});
  const avg=ns.reduce((a,b)=>a+b.m,0)/ns.length,sh=Math.round((72-avg)/12)*12;

function songForNo(no){if(no<6)return null;const k=no-6,N=SONGS.length,cyc=Math.floor(k/N),pos=k%N;
  let idx=pos;if(cyc>0){const r=mulberry32(cyc*977+31),perm=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]];}idx=perm[pos];}
  const notes=SONG_CACHE[idx]||(SONG_CACHE[idx]=parseSong(SONGS[idx]));return{idx,notes,timbre:(cyc+pos)%4};}

// ---------- 레벨별 크기 ----------
function stageParams(lv,st){
  const n=stagesInLevel(lv);let f=n>1?st/(n-1):0;
  const breather=lv>1&&st>0&&st<n-1&&(st+1)%10===0;
  if(breather)f=Math.max(0,f-0.5);
  let a,b,mnL,mxL;
  if(lv===1){a=4;b=5;mnL=2;mxL=4;}
  else if(lv===2){a=7;b=10;mnL=2;mxL=5;}
  else if(lv===3){a=10;b=14;mnL=2;mxL=8;}
  else if(lv===4){a=13;b=19;mnL=2;mxL=11;}
  else{a=Math.min(30,18+(lv-5)*2);b=Math.min(34,a+4);mnL=2;mxL=Math.min(26,12+(lv-5)*2);}
  const cols=Math.round(a+(b-a)*f);
  let tag;if(lv===1||breather)tag='쉬움';else if(f<0.35)tag='보통';else if(f<0.75)tag='어려움';else tag='매우 어려움';
  if(lv>=6&&!breather&&tag==='보통')tag='어려움';
  return{cols,mnL,mxL,tag,lenPow:lv<=3?1.35:lv===4?1.1:lv<=7?0.9:0.75};
}

const TUTORIAL={
  '1-0':{cols:5,rows:7,text:'화살표를 탭하면 가리키는 방향으로 빠져나가요',
    arrows:[[[1,1],[1,2],[1,3],[1,4],[1,5]],[[2,5],[2,4],[2,3],[2,2],[2,1]],[[3,1],[3,2],[3,3],[3,4],[3,5]]]},
  '1-1':{cols:5,rows:6,text:'앞이 막힌 화살표를 누르면 별이 하나 꺼져요. 순서를 찾아보세요',
    arrows:[[[0,2],[1,2],[2,2]],[[3,1],[3,2],[3,3]],[[4,5],[4,4],[4,3]]]}
};

function generate(cols,rows,mnL,mxL,rand,mask,lenPow,region){
  const N=cols*rows,inB=(x,y)=>x>=0&&y>=0&&x<cols&&y<rows,inM=i=>!mask||mask[i]===1;
  const X=i=>i%cols,Y=i=>(i/cols)|0,NB=[[1,0],[-1,0],[0,1],[0,-1]];
  const owner=new Int32Array(N).fill(-1),paths=[];
  const pickW=o=>{let t=0;for(const q of o)t+=q.w;let p=rand()*t,k=0;for(;k<o.length-1;k++){p-=o[k].w;if(p<=0)break;}return k;};
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const nbrs=i=>{const r=[];for(const[dx,dy]of NB){const x=X(i)+dx,y=Y(i)+dy;if(inB(x,y))r.push(y*cols+x);}return r;};
  let curReg=0;const free=i=>inM(i)&&owner[i]===-1&&(!region||region[i]===curReg);
  const hug=i=>{let k=0;for(const[dx,dy]of NB){const x=X(i)+dx,y=Y(i)+dy;if(!inB(x,y)||!inM(y*cols+x)||owner[y*cols+x]!==-1)k++;}return k;};
  function extend(p,atEnd,pid){
    const e=atEnd?p[p.length-1]:p[0],q=p.length>1?(atEnd?p[p.length-2]:p[1]):-1;
    const dx=q<0?9:X(e)-X(q),dy=q<0?9:Y(e)-Y(q),o=[];
    for(const n of nbrs(e)){if(!free(n))continue;const st=(X(n)-X(e)===dx&&Y(n)-Y(e)===dy);o.push({n,w:(st?0.5:0.26)+0.24*hug(n)});}
    if(!o.length)return false;
    const n=o[pickW(o)].n;owner[n]=pid;atEnd?p.push(n):p.unshift(n);return true;
  }
  // 1) 뱀 모양 선으로 채우기
  const order=[];for(let i=0;i<N;i++)if(inM(i))order.push(i);shuffle(order);
  for(const s of order){
    if(owner[s]!==-1)continue;
    const pid=paths.length,p=[s];owner[s]=pid;if(region)curReg=region[s];
    const target=mnL+Math.floor(Math.pow(rand(),lenPow||1.35)*(mxL-mnL+1));
    let end=rand()<0.7;
    while(p.length<target){if(!extend(p,end,pid)&&!extend(p,!end,pid))break;if(rand()<0.12)end=!end;}
    if(p.length===1){
      let done=false;
      for(const n of nbrs(s)){const o=owner[n];if(o<0||o>=paths.length||(region&&region[n]!==region[s]))continue;const P=paths[o];if(P.length>=mxL+2)continue;
        if(P[P.length-1]===n){P.push(s);owner[s]=o;done=true;break;}if(P[0]===n){P.unshift(s);owner[s]=o;done=true;break;}}
      if(!done)owner[s]=-2;continue;
    }
    paths.push(p);
  }
  // 2) 화살로 만들기 (자기 몸을 향하는 화살은 금지)
  const dirOf=c=>{const h=c[c.length-1],t=c[c.length-2];return[X(h)-X(t),Y(h)-Y(t)];};
  const selfBlocked=c=>{const[dx,dy]=dirOf(c),s=new Set(c);let x=X(c[c.length-1])+dx,y=Y(c[c.length-1])+dy;while(inB(x,y)){if(s.has(y*cols+x))return true;x+=dx;y+=dy;}return false;};
  const orient=c=>{let a=rand()<0.5?c.slice():c.slice().reverse();if(selfBlocked(a)){a.reverse();if(selfBlocked(a))return null;}return a;};
  const arrows=[],occ=new Int32Array(N).fill(-1),on=new Set();
  const add=c=>{const id=arrows.length;arrows.push({id,cells:c,dead:false});for(const i of c)occ[i]=id;on.add(id);};
  const split=c=>{const k=2+Math.floor(rand()*(c.length-3));return[c.slice(0,k),c.slice(k)];};
  const q=paths.slice();
  while(q.length){const p=q.pop(),a=orient(p);if(a)add(a);else if(p.length>=4)q.push(...split(p));}
  // 3) 실제로 풀어보며 막힌 곳 고치기
  const isFree=a=>{const c=a.cells,[dx,dy]=dirOf(c);let x=X(c[c.length-1])+dx,y=Y(c[c.length-1])+dy;
    while(inB(x,y)){const o=occ[y*cols+x];if(o>=0&&o!==a.id)return false;x+=dx;y+=dy;}return true;};
  const lift=a=>{on.delete(a.id);for(const i of a.cells)occ[i]=-1;};
  let guard=0;
  while(on.size&&guard++<20000){
    let prog=true;
    while(prog){prog=false;for(const id of [...on]){const a=arrows[id];if(isFree(a)){lift(a);prog=true;}}}
    if(!on.size)break;
    const ids=shuffle([...on]);let fixed=false;
    for(let t=0;t<Math.min(ids.length,120)&&!fixed;t++){const a=arrows[ids[t]],r=a.cells.slice().reverse();
      if(selfBlocked(r))continue;const old=a.cells;a.cells=r;if(isFree(a))fixed=true;else a.cells=old;}
    if(fixed)continue;
    let a=arrows[ids[0]];for(let t=1;t<Math.min(ids.length,25);t++)if(arrows[ids[t]].cells.length>a.cells.length)a=arrows[ids[t]];lift(a);a.dead=true;
    if(a.cells.length>=4)for(const piece of split(a.cells)){const o=orient(piece);if(o)add(o);}
  }
  return arrows.filter(a=>!a.dead).map((a,i)=>{const[dx,dy]=dirOf(a.cells);return{id:i,cells:a.cells.map(k=>[X(k),Y(k)]),dx,dy,color:Math.floor(rand()*7),reg:region?region[a.cells[0]]:-1};});
}

// ---------- 어떤 판에 어떤 모양이 나올지 ----------
// No.6부터 80%는 모양 판. 모양은 "카드 한 벌"을 섞어 차례로 쓰기 때문에, 한 벌을 다 쓰기 전까지 같은 모양이 다시 나오지 않음
const hashNo=n=>{let x=(n*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return x>>>0;};
const isShapeNo=no=>no>=6&&hashNo(no)%100<80;
let _ordCache={no:5,ord:0};
function shapeOrdinal(no){let s=_ordCache.no<no?_ordCache:{no:5,ord:0},ord=s.ord;for(let k=s.no+1;k<no;k++)if(isShapeNo(k))ord++;_ordCache={no:no-1,ord};return ord;}
// 모양 전체를 한 번 섞은 순서를 계속 돌려 씀 → 같은 모양은 항상 '모양 개수'만큼 판이 지나야 다시 나옴(약 220판에 한 번)
let _deck=null;
function deckPerm(cyc,n){if(_deck&&_deck.length===n)return _deck;const r=mulberry32(20260929),p=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}return _deck=p;}
function shapeForNo(no){if(typeof ALL_SHAPES==='undefined'||!isShapeNo(no))return null;const n=ALL_SHAPES.length,ord=shapeOrdinal(no),cyc=Math.floor(ord/n),pos=ord%n;
  return ALL_SHAPES[deckPerm(cyc,n)[pos]];}

function buildBoard(lv,st,daily){
  const key=lv+'-'+st,no=toNo(lv,st);
  if(!daily&&TUTORIAL[key]){const t=TUTORIAL[key];
    const arrows=t.arrows.map((cells,i)=>{const h=cells[cells.length-1],p=cells[cells.length-2];return{id:i,cells,dx:h[0]-p[0],dy:h[1]-p[1],color:i,reg:-1};});
    return{cols:t.cols,rows:t.rows,arrows,text:t.text,mask:null,region:null,shape:null,song:null};}
  // daily: 오늘의 도전 — 날짜 번호(daily)로 판·모양·노래를 정함 (본 게임 판과 겹치지 않음)
  const p=stageParams(lv,st),rand=mulberry32(daily?daily*48271+99991:lv*1000003+st*7919+12345);
  let cols=p.cols,rows,mask=null,region=null;
  const sh=typeof document==='undefined'?null:daily?(hashNo(daily)%100<85?ALL_SHAPES[hashNo(daily*7+3)%ALL_SHAPES.length]:null):shapeForNo(no);
  if(sh){
    if(sh.flag)cols=Math.min(40,Math.max(15,Math.round(p.cols*1.4)));
    else if(sh.text&&sh.text.length>1)cols=Math.min(44,Math.max(15*sh.text.length,Math.round(p.cols*1.5)));
    else if(sh.text)cols=Math.min(46,Math.max(15,Math.round(p.cols*1.9)));
    else cols=Math.min(44,Math.max(13,Math.round(p.cols*1.5)));
    if(sh.minCols)cols=Math.max(cols,sh.minCols);
    rows=Math.max(6,Math.round(cols*sh.asp));
    const r=rasterize(sh,cols,rows);mask=r.mask;region=r.region;
  }else rows=Math.round(cols*1.4);
  const arrows=generate(cols,rows,p.mnL,p.mxL,rand,mask,p.lenPow,region);
  return{cols,rows,arrows,text:'',mask,region,shape:sh,song:songForNo(daily?6+hashNo(daily)%SONGS.length:no)};
}

function mkPen(c,asp){
  const TAU=Math.PI*2;
  return{
    col(x){c.fillStyle=x;c.strokeStyle=x;},
    C(x,y,r){c.beginPath();c.ellipse(x,y,r,r/asp,0,0,TAU);c.fill();},           // 진짜 원
    E(x,y,rx,ry,a){c.beginPath();c.ellipse(x,y,rx,ry,a||0,0,TAU);c.fill();},
    R(x,y,w,h){c.fillRect(x,y,w,h);},
    RR(x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill();},
    P(...p){c.beginPath();for(let i=0;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill();},
    L(w,...p){c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();for(let i=0;i<p.length;i+=2){if(i)c.lineTo(p[i],p[i+1]);else c.moveTo(p[i],p[i+1]);}c.stroke();},
    star(x,y,R,r,n){c.beginPath();n=n||5;for(let i=0;i<n*2;i++){const q=i%2?r:R,a=-Math.PI/2+i*Math.PI/n;c.lineTo(x+q*Math.cos(a),y+q*Math.sin(a)/asp);}c.closePath();c.fill();},
    cut(f){c.globalCompositeOperation='destination-out';f();c.globalCompositeOperation='source-over';},
    clip(path,f){c.save();c.beginPath();path();c.clip();f();c.restore();},
    c
  };
}

const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const TEXT_FONT=px=>'900 '+px+'px "Arial Black","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

// 모양을 캔버스에 그리기 (판 계산용과 바탕 그림용이 같은 함수를 씀)
function paintShape(c,sh,W,H,fill){
  c.fillStyle=fill;c.strokeStyle=fill;
  if(sh.text){let fs=H*0.98;c.font=TEXT_FONT(fs);const w=c.measureText(sh.text).width;if(w>W*0.97){fs*=W*0.97/w;c.font=TEXT_FONT(fs);}
    c.textAlign='center';c.textBaseline='middle';c.fillText(sh.text,W/2,H*0.54);}
  else if(sh.drawPx)sh.drawPx(c,W,H);
  else{const p=sh.flag?0:0.02;c.save();c.setTransform(W*(1-2*p),0,0,H*(1-2*p),W*p,H*p);sh.draw(c,mkPen(c,H/W));c.restore();}
}
// 모양 → 칸마다 (모양 안인지, 어느 색 영역인지)
function rasterize(sh,cols,rows){
  const S=6,W=cols*S,H=rows*S,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d',{willReadFrequently:true});paintShape(c,sh,W,H,'#000');
  const d=c.getImageData(0,0,W,H).data,m=new Uint8Array(cols*rows),reg=sh.pal?new Int8Array(cols*rows).fill(-1):null,pr=sh.pal?sh.pal.map(hexRGB):null;
  // 칸 하나(6x6 픽셀) 중 28% 이상 칠해져 있으면 모양 안으로 봄 → 얇은 획도 살아남음
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let cnt=0,pick=-1;
    for(let yy=0;yy<S;yy++)for(let xx=0;xx<S;xx++){const i=((y*S+yy)*W+x*S+xx)*4;if(d[i+3]>110){cnt++;if(pick<0||(yy===3&&xx===3))pick=i;}}
    if(cnt<17)continue;m[y*cols+x]=1;const i=pick;
    if(reg){let best=0,bd=1e9;for(let k=0;k<pr.length;k++){const q=pr[k],dd=(q[0]-d[i])**2+(q[1]-d[i+1])**2+(q[2]-d[i+2])**2;if(dd<bd){bd=dd;best=k;}}reg[y*cols+x]=best;}}
  return{mask:m,region:reg};
}

// 다시 하기: RP에 지난 번호가 들어 있으면 그 판을, 아니면 지금 진행 중인 판을 불러옴

const todayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();};
const dayNum=()=>Math.floor(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/864e5);
const tgt=()=>DC?{lv:6,st:500,daily:dayNum()}:RP?fromNo(RP):{lv:S.lv,st:S.st};

// ---------- 걸린 시간 ----------
let tAcc=0,tRun=null,tIv=0;
const fmtT=ms=>{const s=ms/1000;if(s<60)return s.toFixed(1)+'초';const m=Math.floor(s/60);return m+'분 '+(s-m*60).toFixed(1)+'초';};
const nowT=()=>tAcc+(tRun!==null?performance.now()-tRun:0);
function showT(){$('#timer').textContent=fmtT(nowT());}
function startT(){if(tRun!==null)return;tRun=performance.now();clearInterval(tIv);tIv=setInterval(showT,100);}
function pauseT(){if(tRun!==null){tAcc+=performance.now()-tRun;tRun=null;}clearInterval(tIv);showT();}
function resetT(){tAcc=0;tRun=null;clearInterval(tIv);showT();}
const bestKey=()=>DC?'d'+todayKey():String(B.no);
function loadStage(){
  const T=tgt();B=buildBoard(T.lv,T.st,T.daily);B.lv=T.lv;B.st=T.st;B.no=DC?null:toNo(T.lv,T.st);B.key=modeKey();
  B.tint=null;if(B.mask&&B.shape){const g={};for(let i=0;i<B.mask.length;i++){if(!B.mask[i])continue;const col=B.shape.pal?B.shape.pal[B.region[i]]:B.shape.tint;(g[col]||(g[col]=[])).push(i);}B.tint=g;}
  occ=new Int16Array(B.cols*B.rows).fill(-1);
  for(const a of B.arrows){a.alive=true;a.removing=false;a.gone=false;a.wrong=false;a.anim=null;a.flash=0;
    for(const [x,y] of a.cells)occ[y*B.cols+x]=a.id;}
  remaining=B.arrows.length;resetT();
  maxStars=starsForLevel(T.lv); stars=maxStars; combo=0; lostStar=false; hintId=-1; busy=false;
  if(!RP&&!DC){LS.set('am_lv',S.lv);LS.set('am_st',S.st);}
  const d=new Date();$('#lvTitle').textContent=DC?'오늘의 도전':'No.'+B.no.toLocaleString();
  const stk=LS.get('am_streak',0);
  $('#lvSub').textContent=DC?(d.getMonth()+1)+'월 '+d.getDate()+'일':RP?'다시 하는 중':(stk>0?'✨ 완벽 연속 '+stk+'/5':'');B.noteI=0;
  $('#tip').textContent=B.text||''; $('#tip').hidden=!B.text;
  renderStars(); updateLeft(); updateHintBadge(); layout(); draw();
}

const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9l-5.8 3.2 1.4-6.4-4.9-4.4 6.5-.7z"/></svg>';

  for(let i=0;i<maxStars;i++){const s=document.createElement('span');s.className='star'+(i<stars?' on':'')+(pop===i?' pop':'');s.innerHTML=STAR_SVG;box.appendChild(s);}

// ---------- 배치·그리기 ----------
function layout(){
  const wrap=$('#boardWrap'),r=wrap.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2.5);
  for(const c of [cv]){c.width=r.width*dpr;c.height=r.height*dpr;c.style.width=r.width+'px';c.style.height=r.height+'px';}
  fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;
  const cell=Math.min((r.width-16)/B.cols,(r.height-16)/B.rows);
  geo={cell,dpr,w:r.width,h:r.height,ox:(r.width-cell*B.cols)/2,oy:(r.height-cell*B.rows)/2,base:cell};
}
// ---------- 확대·이동 ----------
function zoomAt(x,y,k){const nc=Math.max(geo.base,Math.min(Math.max(geo.base,48),geo.cell*k));k=nc/geo.cell;
  geo.ox=x-(x-geo.ox)*k;geo.oy=y-(y-geo.oy)*k;geo.cell=nc;clampView();}
function clampView(){const bw=geo.cell*B.cols,bh=geo.cell*B.rows,m=40;
  geo.ox=bw<=geo.w?(geo.w-bw)/2:Math.min(m,Math.max(geo.w-bw-m,geo.ox));
  geo.oy=bh<=geo.h?(geo.h-bh)/2:Math.min(m,Math.max(geo.h-bh-m,geo.oy));}
function P(a,u){ // 확장 경로 위의 한 점 (몸통 + 머리 앞으로 쭉)
  const L=a.cells.length,i=Math.floor(u),t=u-i;
  const pt=k=>{if(k<L)return a.cells[k];const h=a.cells[L-1],d=k-L+1;return[h[0]+a.dx*d,h[1]+a.dy*d];};
  const p0=pt(i),p1=pt(i+1);
  return[geo.ox+(p0[0]+(p1[0]-p0[0])*t+.5)*geo.cell,geo.oy+(p0[1]+(p1[1]-p0[1])*t+.5)*geo.cell];
}
function strokeArrow(a,s,color,wMul){
  const L=a.cells.length,u0=s,u1=s+L-1,c=geo.cell;
  ctx.beginPath();const p0=P(a,u0);ctx.moveTo(p0[0],p0[1]);
  for(let i=Math.floor(u0)+1;i<u1;i++){const p=P(a,i);ctx.lineTo(p[0],p[1]);}
  const e=P(a,u1),b=P(a,u1-0.02);ctx.lineTo(e[0],e[1]);
  ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,c*0.14)*wMul;ctx.stroke();
  let dx=e[0]-b[0],dy=e[1]-b[1];const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
  const tip=[e[0]+dx*c*0.2,e[1]+dy*c*0.2],hl=c*0.4*Math.min(wMul,1.25),hw=c*0.24*Math.min(wMul,1.25);
  ctx.beginPath();ctx.moveTo(tip[0],tip[1]);
  ctx.lineTo(tip[0]-dx*hl-dy*hw,tip[1]-dy*hl+dx*hw);ctx.lineTo(tip[0]-dx*hl+dy*hw,tip[1]-dy*hl-dx*hw);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
}
function draw(now){
  if(!B)return;now=now||performance.now();
  const th=THEMES[S.theme];
  ctx.setTransform(geo.dpr,0,0,geo.dpr,0,0);ctx.clearRect(0,0,geo.w,geo.h);
  ctx.lineCap='round';ctx.lineJoin='round';
  drawDots(th);
  if(S.path)drawPaths(th);
  for(const a of B.arrows){
    if(a.gone)continue;
    const s=a.anim?a.anim.s:0;
    let col=a.wrong?th.wrong:(a.reg>=0&&B.shape&&B.shape.pal?paintCol(B.shape.pal[a.reg],th):th.colors[a.color%th.colors.length]),w=a.wrong?1.25:1;
    if(a.flash>now){const on=Math.floor((a.flash-now)/110)%2===0;if(on){col=th.wrong;w=1.2;}}
    if(a.id===hintId){const k=(Math.sin(now/180)+1)/2;ctx.globalAlpha=0.25+0.35*k;strokeArrow(a,s,col,3.2);ctx.globalAlpha=1;w=1.3;}
    if(th.glow){ctx.globalAlpha=0.22;strokeArrow(a,s,col,w*2.6);ctx.globalAlpha=1;}
    strokeArrow(a,s,col,w);
  }
}

function paintCol(hex,th){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),l=(0.299*r+0.587*g+0.114*b)/255;
  if(!th.dark&&l>0.86)return '#b4b4c2';if(th.dark&&l<0.14)return '#7c7c8c';return hex;}
const BD={key:'',cv:null};
function drawDots(th){
  const c=geo.cell,m=B.mask,C=B.cols,Rw=B.rows,inM=(x,y)=>x>=0&&y>=0&&x<C&&y<Rw&&(!m||m[y*C+x]);
  const cx=x=>geo.ox+(x+.5)*c,cy=y=>geo.oy+(y+.5)*c;
  if(B.shape){ // 모양을 매끈한 그림으로 연하게 깔아 실루엣이 또렷하게 보이게
    const bw=B.cols*c,bh=B.rows*c,sc=Math.min(geo.dpr,1600/bw),w=Math.round(bw*sc),h=Math.round(bh*sc);
    if(w>4&&h>4){const key=B.key+'|'+w+'x'+h;if(BD.key!==key){BD.cv=BD.cv||document.createElement('canvas');BD.cv.width=w;BD.cv.height=h;const bc=BD.cv.getContext('2d');bc.clearRect(0,0,w,h);paintShape(bc,B.shape,w,h,B.shape.tint||'#999');BD.key=key;}
      ctx.globalAlpha=B.shape.pal?(th.dark?0.3:0.26):(th.dark?0.24:0.22);ctx.drawImage(BD.cv,geo.ox,geo.oy,bw,bh);ctx.globalAlpha=1;}}
  if(S.grid){ // 격자선: 판 바깥까지 화면 전체에 연하게
    ctx.beginPath();
    for(let x=Math.floor(-geo.ox/c)-1;cx(x)<=geo.w+c;x++){ctx.moveTo(cx(x),0);ctx.lineTo(cx(x),geo.h);}
    for(let y=Math.floor(-geo.oy/c)-1;cy(y)<=geo.h+c;y++){ctx.moveTo(0,cy(y));ctx.lineTo(geo.w,cy(y));}
    ctx.strokeStyle=th.dot;ctx.globalAlpha=th.dark?0.26:0.38;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;}
  ctx.beginPath();const r=Math.max(1.2,c*0.075);
  for(let y=0;y<Rw;y++)for(let x=0;x<C;x++){if(!inM(x,y))continue;ctx.moveTo(cx(x)+r,cy(y));ctx.arc(cx(x),cy(y),r,0,6.2832);}
  ctx.fillStyle=th.dot;ctx.fill();
}
// 경로선: 화살 머리 앞에서 화면 끝까지, 같은 색으로 연하게
function drawPaths(th){
  const c=geo.cell;ctx.lineWidth=Math.max(1.2,c*0.1);ctx.globalAlpha=th.dark?0.3:0.26;
  for(const a of B.arrows){if(!a.alive||a.anim)continue;
    const h=a.cells[a.cells.length-1],x=geo.ox+(h[0]+.5)*c,y=geo.oy+(h[1]+.5)*c,far=geo.w+geo.h;
    ctx.beginPath();ctx.moveTo(x+a.dx*c*0.45,y+a.dy*c*0.45);ctx.lineTo(x+a.dx*far,y+a.dy*far);
    ctx.strokeStyle=a.wrong?th.wrong:th.colors[a.color%th.colors.length];ctx.stroke();}
  ctx.globalAlpha=1;
}
// ---------- 애니메이션 루프 ----------
let raf=0, confetti=[];
function kick(){if(!raf)raf=requestAnimationFrame(loop);}
function loop(now){
  raf=0;let active=false;
  for(const a of B.arrows){
    const an=a.anim;if(!an)continue;const t=Math.max(0,(now-an.t0)/1000);
    if(an.type==='exit'){an.s=7*t+46*t*t;if(an.s>=an.total){a.gone=true;a.anim=null;}else active=true;}
    else{ // 부딪히고 되돌아오기
      if(t<an.out)an.s=an.d*easeOut(t/an.out);
      else if(t<an.out+0.16)an.s=an.d*(1-easeOut((t-an.out)/0.16));
      else{an.s=0;a.anim=null;}
      active=true;
    }
    if(a.flash>now)active=true;
  }
  if(B.arrows.some(a=>a.flash>now))active=true;
  if(hintId>=0)active=true;
  draw(now);
  if(confetti.length){drawConfetti();active=true;}
  if(active)kick();
}
const easeOut=x=>1-Math.pow(1-Math.min(1,x),3);

// ---------- 탭 ----------
function arrowAt(px,py){
  const c=geo.cell,fx_=(px-geo.ox)/c,fy_=(py-geo.oy)/c,cx=Math.floor(fx_),cy=Math.floor(fy_);
  let best=-1,bd=0.8;
  for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++){
    if(x<0||y<0||x>=B.cols||y>=B.rows)continue;const id=occ[y*B.cols+x];if(id<0)continue;
    const d=Math.hypot(fx_-(x+.5),fy_-(y+.5));if(d<bd){bd=d;best=id;}
  }
  return best;
}
// 한 손가락 탭 = 화살 누르기, 한 손가락 끌기 = 이동, 두 손가락 = 확대/축소
const ptrs=new Map();let gest=null;
const rel=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const[x,y]=rel(e);ptrs.set(e.pointerId,{x,y});
  if(ptrs.size===1)gest={t:'tap',x0:x,y0:y};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];gest={t:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!gest)return;const[x,y]=rel(e),pv=ptrs.get(e.pointerId);
  if(gest.t==='pinch'&&ptrs.size===2){pv.x=x;pv.y=y;const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    geo.ox+=cx-gest.cx;geo.oy+=cy-gest.cy;zoomAt(cx,cy,d/(gest.d||d));gest.d=d;gest.cx=cx;gest.cy=cy;draw();return;}
  if(gest.t==='tap'&&Math.hypot(x-gest.x0,y-gest.y0)>9)gest.t='pan';
  if(gest.t==='pan'){geo.ox+=x-pv.x;geo.oy+=y-pv.y;clampView();draw();}
  pv.x=x;pv.y=y;});
function endPtr(e,cancel){if(!ptrs.has(e.pointerId))return;const[x,y]=rel(e);ptrs.delete(e.pointerId);
  if(!cancel&&gest&&gest.t==='tap'&&ptrs.size===0&&!busy){const id=arrowAt(x,y);
    if(id>=0){const a=B.arrows[id];if(a.alive&&!a.anim){Snd.unlock();tapArrow(a);}}}
  if(ptrs.size===0)gest=null;else if(gest&&gest.t==='pinch')gest={t:'done'};}
cv.addEventListener('pointerup',e=>endPtr(e,false));cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=rel(e);zoomAt(x,y,e.deltaY<0?1.15:1/1.15);draw();},{passive:false});

$('#gridBtn').addEventListener('click',()=>{S.grid=!S.grid;applyGrid();draw();toast(S.grid?'격자선 켬':'격자선 끔');});
function tapArrow(a){
  startT();
  const h=a.cells[a.cells.length-1];let x=h[0]+a.dx,y=h[1]+a.dy,k=1,blocker=-1,rayLen=0;
  while(x>=0&&y>=0&&x<B.cols&&y<B.rows){const o=occ[y*B.cols+x];if(o>=0&&o!==a.id){blocker=o;break;}x+=a.dx;y+=a.dy;k++;rayLen++;}
  const now=performance.now();
  if(blocker<0){ // 성공
    for(const [cx,cy] of a.cells)occ[cy*B.cols+cx]=-1;
    a.alive=false;a.removing=true;a.anim={type:'exit',t0:now,s:0,total:rayLen+a.cells.length+Math.max(B.cols,B.rows)};
    if(hintId===a.id)hintId=-1;
    combo++;if(B.song){const nt=B.song.notes[B.noteI++%B.song.notes.length];Snd.note(nt.f,nt.d,B.song.timbre);}else Snd.swish(combo);remaining--;updateLeft();
    if(remaining===0){busy=true;pauseT();setTimeout(onClear,520);}
  }else{ // 실패
    a.wrong=true;a.anim={type:'bump',t0:now,s:0,d:k-1+0.32,out:0.07+0.03*k};
    B.arrows[blocker].flash=now+660;
    combo=0;stars--;lostStar=true;Snd.fail();
    try{navigator.vibrate&&navigator.vibrate(45);}catch(e){}
    renderStars(stars);
    if(stars<=0){busy=true;setTimeout(showOutOfStars,650);}
  }
  kick();
}

function burst(n){
  const cols=THEMES[S.theme].colors,W=innerWidth,H=innerHeight;
  for(let i=0;i<n;i++){const left=i%2===0;
    confetti.push({x:left?-10:W+10,y:H*0.62,vx:(left?1:-1)*(3+Math.random()*7),vy:-(8+Math.random()*9),g:0.28+Math.random()*0.1,
      r:Math.random()*6.28,vr:(Math.random()-.5)*0.4,w:5+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length],life:0});}
  kick();
}
function drawConfetti(){
  const d=geo.dpr;fctx.setTransform(d,0,0,d,0,0);fctx.clearRect(0,0,innerWidth,innerHeight);
  const glow=THEMES[S.theme].glow;
  confetti=confetti.filter(p=>p.y<innerHeight+40&&p.life<400);
  for(const p of confetti){p.vy+=p.g;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;
    if(glow){fctx.shadowColor=p.c;fctx.shadowBlur=8;}
    fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3)));fctx.restore();}
  if(!confetti.length)fctx.clearRect(0,0,innerWidth,innerHeight);
}

// ---------- 소리 (파일 없이 코드로 만듦) ----------
const Snd=(()=>{
  let ac=null,noise=null;
  const on=()=>S.sound!=='off'&&ac;
  function unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();
    noise=ac.createBuffer(1,ac.sampleRate*0.4,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
    if(ac&&ac.state==='suspended')ac.resume();}
  function tone(f,t,dur,type,vol,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.02);}
  function swish(c){if(!on())return;const t=ac.currentTime,src=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();
    src.buffer=noise;bp.type='bandpass';bp.Q.value=1.4;bp.frequency.setValueAtTime(900,t);bp.frequency.exponentialRampToValueAtTime(3800,t+0.13);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    src.connect(bp).connect(g).connect(ac.destination);src.start(t);src.stop(t+0.2);
    const step=[0,2,4,7,9,12,14,16,19,21,24][Math.min(c-1,10)];tone(523*Math.pow(2,step/12),t+0.01,0.12,'triangle',0.07);} // 연속 성공할수록 음이 올라감
  function fail(){if(!on())return;const t=ac.currentTime;
    if(S.sound==='fun'){const o=ac.createOscillator(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
      o.type='sine';o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(110,t+0.45);lfo.frequency.value=22;lg.gain.value=40;
      lfo.connect(lg).connect(o.frequency);g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g).connect(ac.destination);o.start(t);lfo.start(t);o.stop(t+0.52);lfo.stop(t+0.52);}
    else tone(150,t,0.2,'sine',0.35,70);}
  // 음색 4가지를 판마다 번갈아: 0 오르골, 1 피아노, 2 실로폰, 3 종소리
  function note(f,d,tb){if(!on())return;const t=ac.currentTime,len=Math.min(1.2,0.3*d+0.18);
    if(S.sound==='fun'){tone(f,t,len,'square',0.07);}
    else if(tb===0){tone(f,t,len*0.8,'sine',0.17);tone(f*4,t,0.18,'sine',0.025);}
    else if(tb===2){tone(f,t,Math.min(len,0.4),'sine',0.22);tone(f*4,t,0.06,'sine',0.04);}
    else if(tb===3){tone(f,t,len+0.6,'sine',0.12);tone(f*2.76,t,0.5,'sine',0.045);}
    else{tone(f,t,len,'triangle',0.16);tone(f*2,t,len*0.6,'sine',0.035);}
    const src=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();src.buffer=noise;bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=1.2;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.06,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);src.connect(bp).connect(g).connect(ac.destination);src.start(t);src.stop(t+0.14);}
  function hint(){if(!on())return;const t=ac.currentTime;tone(880,t,0.25,'sine',0.12);tone(1320,t+0.09,0.3,'sine',0.08);}
  function fanfare(big){if(!on())return;const t=ac.currentTime,fun=S.sound==='fun',ty=fun?'square':'triangle',v=fun?0.07:0.12;
    [523,659,784].forEach((f,i)=>tone(f,t+i*0.11,0.16,ty,v));
    [523,659,784,1047].forEach(f=>tone(f,t+0.36,big?1.1:0.7,ty,v*0.8));
    if(big)[659,784,1047,1319].forEach((f,i)=>tone(f,t+1.0+i*0.09,0.5,ty,v*0.7));
    if(fun){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(260,t+0.3);o.frequency.exponentialRampToValueAtTime(700,t+0.55);
      g.gain.setValueAtTime(0.0001,t+0.3);g.gain.exponentialRampToValueAtTime(0.06,t+0.34);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);o.connect(g).connect(ac.destination);o.start(t+0.3);o.stop(t+0.72);}}
  // "WOW" 목소리 자리: 녹음 파일이 준비되면 여기서 재생합니다 (지금은 비어 있음)
  function voice(special){/* 예: if(on()&&special) new Audio('wow.mp3').play(); */}
  return{unlock,swish,note,fail,hint,fanfare,voice};
})();

  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('sel',b.dataset.t===S.theme));draw();}
function buildThemePicker(){const box=$('#themeList');
  for(const k in THEMES){const t=THEMES[k],b=document.createElement('button');b.className='sw';b.dataset.t=k;b.setAttribute('aria-label',t.name+' 테마');
    b.innerHTML='<span class="swv sw-'+k+'">'+[0,1,2].map(i=>'<i style="background:'+t.colors[i]+'"></i>').join('')+'</span><em>'+t.name+'</em>';
    b.onclick=()=>{S.theme=k;applyTheme();};box.appendChild(b);}}
$('#themeBtn').addEventListener('click',e=>{e.stopPropagation();$('#themePop').hidden=!$('#themePop').hidden;});
document.addEventListener('click',e=>{if(!e.target.closest('#themePop'))$('#themePop').hidden=true;});

$('#soundBtn').addEventListener('click',()=>{Snd.unlock();S.sound={basic:'fun',fun:'off',off:'basic'}[S.sound];applySound();toast(SOUND_LABEL[S.sound]);});
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1300);}

  $('#jumpModal').hidden=true;$('#clearModal').hidden=true;$('#outModal').hidden=true;loadStage();});
$('#jumpClose').addEventListener('click',()=>$('#jumpModal').hidden=true);

// ---------- 처음 화면 배경: 알록달록한 화살들이 하나씩 빠져나감 ----------
const HB=(()=>{
  const cv=$('#homeBg'),cx=cv.getContext('2d'),COL=['#ff5a5f','#ff9f1c','#ffd23f','#3bceac','#3a86ff','#8338ec','#ff4fa3','#06d6a0'];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let A=[],occ,C,R,c=30,ox,oy,W,H,dpr,raf=0,last=0,on=false;
  function init(){const r=cv.getBoundingClientRect();if(!r.width||!r.height){requestAnimationFrame(init);return;}dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
    C=Math.ceil(W/c)+1;R=Math.ceil(H/c)+1;ox=(W-C*c)/2;oy=(H-R*c)/2;
    A=generate(C,R,2,7,mulberry32((Math.random()*1e9)|0),null).map(x=>Object.assign(x,{alive:true,s:0,t0:0,gone:false}));
    occ=new Int16Array(C*R).fill(-1);for(const x of A)for(const[q,w]of x.cells)occ[w*C+q]=x.id;}
  function pt(a,u){const L=a.cells.length,i=Math.floor(u),t=u-i,g=k=>{if(k<L)return a.cells[k];const h=a.cells[L-1],d=k-L+1;return[h[0]+a.dx*d,h[1]+a.dy*d];},p=g(i),q=g(i+1);
    return[ox+(p[0]+(q[0]-p[0])*t+.5)*c,oy+(p[1]+(q[1]-p[1])*t+.5)*c];}
  function drawA(a){const L=a.cells.length,u1=a.s+L-1;cx.beginPath();let p=pt(a,a.s);cx.moveTo(p[0],p[1]);
    for(let i=Math.floor(a.s)+1;i<u1;i++){p=pt(a,i);cx.lineTo(p[0],p[1]);}
    const e=pt(a,u1),b=pt(a,u1-.02);cx.lineTo(e[0],e[1]);const col=COL[a.color%COL.length];cx.strokeStyle=col;cx.lineWidth=4.5;cx.stroke();
    let dx=e[0]-b[0],dy=e[1]-b[1];const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;const tp=[e[0]+dx*6,e[1]+dy*6];
    cx.beginPath();cx.moveTo(tp[0],tp[1]);cx.lineTo(tp[0]-dx*12-dy*7,tp[1]-dy*12+dx*7);cx.lineTo(tp[0]-dx*12+dy*7,tp[1]-dy*12-dx*7);cx.closePath();cx.fillStyle=col;cx.fill();}
  function free(a){const h=a.cells[a.cells.length-1];let x=h[0]+a.dx,y=h[1]+a.dy;while(x>=0&&y>=0&&x<C&&y<R){const o=occ[y*C+x];if(o>=0&&o!==a.id)return false;x+=a.dx;y+=a.dy;}return true;}
  function frame(now){raf=0;if(!on)return;if(!A.length){raf=requestAnimationFrame(frame);return;}
    if(!reduce&&now-last>260){last=now;const f=A.filter(a=>a.alive&&free(a));
      if(f.length){const a=f[Math.floor(Math.random()*f.length)];a.alive=false;a.t0=now;for(const[q,w]of a.cells)occ[w*C+q]=-1;}
      else if(!A.some(a=>!a.alive&&!a.gone))init();}
    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);cx.lineCap='round';cx.lineJoin='round';cx.globalAlpha=.45;
    for(const a of A){if(a.gone)continue;if(!a.alive){const t=(now-a.t0)/1000;a.s=7*t+46*t*t;if(a.s>C+R+a.cells.length){a.gone=true;continue;}}drawA(a);}
    cx.globalAlpha=1;if(!reduce)raf=requestAnimationFrame(frame);}
  return{start(){on=true;init();if(!raf)raf=requestAnimationFrame(frame);},stop(){on=false;if(raf)cancelAnimationFrame(raf);raf=0;},resize(){if(on){init();if(!raf)raf=requestAnimationFrame(frame);}}};
})();
window.addEventListener('resize',()=>{HB.resize();if(!$('#home').hidden){renderHome();drawLogoArt();}});
// ---------- 처음 화면 ----------
const STAR_MINI='<svg viewBox="0 0 24 24"><path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9l-5.8 3.2 1.4-6.4-4.9-4.4 6.5-.7z"/></svg>';
const PADLOCK='<svg class="padlock" viewBox="0 0 46 52" aria-hidden="true"><path d="M13 22v-7a10 10 0 0 1 20 0v7" fill="none" stroke="#c9ced9" stroke-width="6"/><rect x="5" y="21" width="36" height="28" rx="9" fill="#ffb020"/><rect x="5" y="41" width="36" height="8" rx="4" fill="#e08d00"/><circle cx="23" cy="33" r="4" fill="#8a5200"/><rect x="21" y="34" width="4" height="7" rx="2" fill="#8a5200"/></svg>';
function renderHome(){
  const no=toNo(S.lv,S.st),road=$('#track'),perfect=LS.get('am_perfect',{});
  const st3=k=>perfect[k]?'<span class="st">'+STAR_MINI+STAR_MINI+STAR_MINI+'</span>':'';
  let html='<div class="node far">'+(no+2).toLocaleString()+'</div><div class="seg"></div><div class="node lock">'+(no+1).toLocaleString()+'</div><div class="seg"></div>'+PADLOCK+'<div class="seg"></div>';
  html+='<div class="node now" id="nowNode">'+st3(no)+no.toLocaleString()+'</div>';
  const low=Math.max(1,no-150);
  const bests=LS.get('am_best',{});
  for(let k=no-1;k>=low;k--)html+='<div class="seg done"'+(bests[k]!==undefined?' style="height:40px"':'')+'></div><button class="node done" data-no="'+k+'" aria-label="No.'+k+' 다시 하기">'+st3(k)+k.toLocaleString()+(bests[k]!==undefined?'<span class="bt">'+fmtT(bests[k])+'</span>':'')+'</button>';
  if(no>1)html+='<p class="roadTip">지난 번호를 누르면 다시 할 수 있어요</p>';
  road.innerHTML=html;
  const nowEl=$('#nowNode');road.scrollTop=nowEl.offsetTop-road.clientHeight/2+nowEl.offsetHeight/2;
  $('#goNo').textContent='No.'+no.toLocaleString();
  const tok=LS.get('am_skip',0);$('#homeSkip').hidden=tok<=0;$('#homeSkip').textContent='⏩ +10판 건너뛰기'+(tok>1?' ×'+tok:'');
  const dd=LS.get('am_daily',{})[todayKey()];$('#dailyBtn').innerHTML='🏆 오늘의 도전'+(dd?' <b>✓</b>':'');
}
$('#track').addEventListener('click',e=>{const b=e.target.closest('button[data-no]');if(!b)return;Snd.unlock();DC=false;RP=+b.dataset.no;showGame();});
// 제목 밑 네온 화살 미로 그림
function drawLogoArt(){
  const cv=$('#logoArt'),r=cv.getBoundingClientRect();if(!r.width)return;const d=Math.min(devicePixelRatio||1,2.5);
  cv.width=r.width*d;cv.height=r.height*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
  const cell=r.height>70?12:10,C=Math.floor((r.width-10)/cell),R=Math.floor((r.height-8)/cell),ox=(r.width-C*cell)/2,oy=(r.height-R*cell)/2;
  const arrows=generate(C,R,2,9,mulberry32(20260928),null),col=THEMES.neon.colors;
  c.lineCap='round';c.lineJoin='round';
  const P=(p)=>[ox+(p[0]+.5)*cell,oy+(p[1]+.5)*cell];
  for(const pass of [0,1])for(const a of arrows){const k=col[a.color%col.length];
    c.beginPath();a.cells.forEach((p,i)=>{const q=P(p);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});
    c.strokeStyle=k;c.globalAlpha=pass?1:.28;c.lineWidth=pass?2.2:6;c.stroke();
    if(pass){const h=P(a.cells[a.cells.length-1]),tx=h[0]+a.dx*3.5,ty=h[1]+a.dy*3.5;
      c.beginPath();c.moveTo(tx,ty);c.lineTo(tx-a.dx*6-a.dy*3.6,ty-a.dy*6+a.dx*3.6);c.lineTo(tx-a.dx*6+a.dy*3.6,ty-a.dy*6-a.dx*3.6);c.closePath();c.fillStyle=k;c.fill();}}
  c.globalAlpha=1;
}
function showHome(){pauseT();$('#game').hidden=true;$('#home').hidden=false;$('#themePop').hidden=true;renderHome();HB.start();requestAnimationFrame(drawLogoArt);}
function showGame(){HB.stop();$('#home').hidden=true;$('#game').hidden=false;
  if(!(history.state&&history.state.g))try{history.pushState({g:1},'');}catch(e){}
  const same=B&&B.key===modeKey()&&remaining>0&&stars>0;if(same&&tAcc>0)startT();
  if(!same)loadStage();else{layout();draw();}}
$('#goBtn').addEventListener('click',()=>{Snd.unlock();RP=null;DC=false;showGame();});
$('#dailyBtn').addEventListener('click',()=>{Snd.unlock();RP=null;DC=true;showGame();});
$('#homeSkip').addEventListener('click',()=>{if(useSkip(toNo(S.lv,S.st))){renderHome();toast('10판을 건너뛰었어요!');}});

function firstRun(){if(LS.get('am_started',false)||toNo(S.lv,S.st)>1)return;$('#firstModal').hidden=false;}
$('#firstNew').addEventListener('click',()=>{LS.set('am_started',true);$('#firstModal').hidden=true;});
$('#firstPro').addEventListener('click',()=>{LS.set('am_started',true);const r=fromNo(26);S.lv=r.lv;S.st=r.st;LS.set('am_lv',S.lv);LS.set('am_st',S.st);$('#firstModal').hidden=true;renderHome();});
$('#homeBtn').addEventListener('click',()=>{if(history.state&&history.state.g)history.back();else showHome();});
// 휴대폰 뒤로가기 버튼: 게임 중이면 앱을 닫지 않고 처음 화면으로
window.addEventListener('popstate',()=>{if(!$('#game').hidden){$('#clearModal').hidden=true;$('#outModal').hidden=true;showHome();}});
$('#homeTheme').addEventListener('click',e=>{e.stopPropagation();const p=$('#themePop');p.hidden=!p.hidden;});
buildThemePicker();applyTheme();applySound();applyGrid();applyPath();showHome();firstRun();
